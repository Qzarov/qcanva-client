apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Q Space storage node: the Rust core (qspace-agent/crates/qspace-ffi) as
// libqspace_ffi.so plus Kotlin bindings generated by UniFFI. Both are build
// outputs of scripts/build-qspace-native.sh and are not committed. Without
// them the app still builds: a stub backend is compiled in and the plugin
// reports isAvailable() == false. Pass -PqspaceNative=required to make a
// missing native part a build error (CI does this when it can build it), or
// -PqspaceNative=off to leave it out even when present.
def qspaceGeneratedDir = file('src/qspaceGenerated')
def qspaceBindings = new File(qspaceGeneratedDir, 'java/uniffi/qspace_ffi/qspace_ffi.kt')
def qspaceAbis = ['arm64-v8a', 'x86_64'].findAll {
    new File(qspaceGeneratedDir, "jniLibs/${it}/libqspace_ffi.so").exists()
}
def qspaceMode = (findProperty('qspaceNative') ?: 'auto').toString()
if (!['auto', 'required', 'off'].contains(qspaceMode)) {
    throw new GradleException("qspaceNative must be auto, required or off, got '${qspaceMode}'.")
}
def qspaceNative = qspaceMode != 'off' && qspaceBindings.exists() && !qspaceAbis.isEmpty()
if (qspaceMode == 'required' && !qspaceNative) {
    throw new GradleException('Q Space native library is missing: expected ' +
        'app/src/qspaceGenerated/java/uniffi/qspace_ffi/qspace_ffi.kt and ' +
        'app/src/qspaceGenerated/jniLibs/<abi>/libqspace_ffi.so. Run ' +
        'scripts/build-qspace-native.sh (QSPACE_AGENT_DIR points at the qspace-agent checkout).')
}
if (qspaceNative) {
    logger.lifecycle("Q Space storage node: bundled for ${qspaceAbis.join(', ')}")
} else {
    logger.warn('Q Space storage node: not bundled (run scripts/build-qspace-native.sh to include it). ' +
        'The app builds without it and QSpaceAgent.isAvailable() returns false.')
}

// One APK per ABI instead of a single APK carrying every native library: the
// storage node's libqspace_ffi.so is the bulk of the app. Release builds split
// by default; -PabiSplits=true|false overrides that, e.g. for a per-ABI debug
// APK. Debug builds keep the single app-debug.apk that `npx cap run android`
// and Android Studio install. The AAB is not affected: Play splits it itself.
def splitAbis = ['arm64-v8a', 'x86_64']
def abiSplitsProperty = findProperty('abiSplits')
def abiSplits = abiSplitsProperty != null
    ? abiSplitsProperty.toString().toBoolean()
    : gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

def releasePropertiesFile = rootProject.file('keystore.properties')
def releaseProperties = new Properties()
def hasReleaseSigning = releasePropertiesFile.exists()
if (hasReleaseSigning) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseVersionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
def releaseVersionName = System.getenv('VERSION_NAME') ?: '1.0'

android {
    namespace = "pro.qzarov.qcanva"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pro.qzarov.qcanva"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI supplies these values from the release tag. Local builds keep
        // the existing defaults, so Android Studio needs no extra setup.
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseProperties['storeFile'])
                storePassword releaseProperties['storePassword']
                keyAlias releaseProperties['keyAlias']
                keyPassword releaseProperties['keyPassword']
            }
        }
    }
    sourceSets {
        main {
            if (qspaceNative) {
                java.srcDirs += ['src/qspaceNode/java', 'src/qspaceGenerated/java']
                jniLibs.srcDirs += ['src/qspaceGenerated/jniLibs']
            } else {
                java.srcDirs += ['src/qspaceStub/java']
            }
        }
    }
    splits {
        abi {
            enable abiSplits
            reset()
            include(*splitAbis)
            universalApk false
        }
    }
    packaging {
        jniLibs {
            // JNA ships libjnidispatch for ABIs Android no longer supports.
            excludes += ['lib/armeabi/**', 'lib/mips/**', 'lib/mips64/**']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        // Matches the Java 21 target that Capacitor sets in capacitor.build.gradle.
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

gradle.taskGraph.whenReady { graph ->
    def isReleaseBuild = graph.allTasks.any { task -> task.name.toLowerCase().contains('release') }
    if (isReleaseBuild && !hasReleaseSigning) {
        throw new GradleException('Release signing is not configured. Copy android/keystore.properties.example to android/keystore.properties and provide the upload key outside Git.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    if (qspaceNative) {
        // Runtime for the generated UniFFI bindings; not needed by the stub.
        implementation "net.java.dev.jna:jna:$jnaVersion@aar"
    }
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
