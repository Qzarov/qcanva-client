name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version displayed in the app, for example 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The app's menu shows the version from package.json, the build takes it
      # from the tag. v1.8.7 - v1.9.0 shipped with the menu still saying 1.8.6.
      - name: Check that package.json has the released version
        env:
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}"
          PACKAGE_VERSION="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n 1)"
          if [ "$PACKAGE_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::package.json says $PACKAGE_VERSION, the release is $VERSION_NAME. Set \"version\" in package.json (npm version $VERSION_NAME --no-git-tag-version), merge it into main and tag again."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Restore Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/qcanva-upload.jks
          chmod 600 android/qcanva-upload.jks
          {
            # app/build.gradle resolves relative signing paths from android/app.
            echo 'storeFile=../qcanva-upload.jks'
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed AAB and APK
        env:
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}"
          npm run android:sync
          cd android
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}"
          # A tag moved to a newer commit is built again: its earlier release
          # is replaced, not left to fail this step. The tag itself is kept.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            --title "QCanva $VERSION_NAME" \
            --generate-notes \
            android/app/build/outputs/bundle/release/app-release.aab#qcanva-${VERSION_NAME}.aab \
            android/app/build/outputs/apk/release/app-release.apk#qcanva-${VERSION_NAME}.apk
