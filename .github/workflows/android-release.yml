name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version displayed in the app, for example 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      # Q Space storage node: the Rust core from the private Qzarov/qspace-agent,
      # pinned to a commit. Checking it out needs the repository secret
      # QSPACE_AGENT_DEPLOY_KEY (private half of a read-only deploy key on
      # qspace-agent). Without the secret the release is built without the
      # storage node, and the app reports it as unavailable.
      QSPACE_AGENT_REF: 4993f2772954646168a983132d36d2be725d17f9
      QSPACE_NATIVE: ${{ secrets.QSPACE_AGENT_DEPLOY_KEY != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The app's menu shows the version from package.json, the build takes it
      # from the tag. v1.8.7 - v1.9.0 shipped with the menu still saying 1.8.6.
      - name: Check that package.json has the released version
        env:
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}"
          PACKAGE_VERSION="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n 1)"
          if [ "$PACKAGE_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::package.json says $PACKAGE_VERSION, the release is $VERSION_NAME. Set \"version\" in package.json (npm version $VERSION_NAME --no-git-tag-version), merge it into main and tag again."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Note a release without the storage node
        if: env.QSPACE_NATIVE != 'true'
        run: echo "::warning::QSPACE_AGENT_DEPLOY_KEY is not set, building without the Q Space storage node."

      - name: Check out qspace-agent
        if: env.QSPACE_NATIVE == 'true'
        uses: actions/checkout@v4
        with:
          repository: Qzarov/qspace-agent
          ref: ${{ env.QSPACE_AGENT_REF }}
          ssh-key: ${{ secrets.QSPACE_AGENT_DEPLOY_KEY }}
          path: qspace-agent

      - name: Set up Rust for Android
        if: env.QSPACE_NATIVE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        if: env.QSPACE_NATIVE == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: qspace-agent

      # r28+ aligns native libraries to 16 KB pages by default.
      - name: Set up Android NDK
        if: env.QSPACE_NATIVE == 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install cargo-ndk
        if: env.QSPACE_NATIVE == 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # Builds libqspace_ffi.so for arm64-v8a and x86_64 and the UniFFI Kotlin
      # bindings into android/app/src/qspaceGenerated (not in git).
      - name: Build the Q Space storage node
        if: env.QSPACE_NATIVE == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          QSPACE_AGENT_DIR: ${{ github.workspace }}/qspace-agent
        run: scripts/build-qspace-native.sh

      - name: Restore Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/qcanva-upload.jks
          chmod 600 android/qcanva-upload.jks
          {
            # app/build.gradle resolves relative signing paths from android/app.
            echo 'storeFile=../qcanva-upload.jks'
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      # Release builds split the APK by ABI (android/app/build.gradle): one for
      # phones (arm64-v8a) and one for the x86_64 emulator, each carrying only
      # its own native libraries. The AAB holds every ABI; Play splits it.
      - name: Build signed AAB and per-ABI APKs
        env:
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}"
          npm run android:sync
          cd android
          # With the agent checked out a missing native part is an error,
          # without it the stub is compiled in.
          QSPACE_MODE=auto
          if [ "$QSPACE_NATIVE" = "true" ]; then QSPACE_MODE=required; fi
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon -PqspaceNative="$QSPACE_MODE" -PabiSplits=true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}"
          # A tag moved to a newer commit is built again: its earlier release
          # is replaced, not left to fail this step. The tag itself is kept.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            --title "QCanva $VERSION_NAME" \
            --generate-notes \
            android/app/build/outputs/bundle/release/app-release.aab#qcanva-${VERSION_NAME}.aab \
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk#qcanva-${VERSION_NAME}-arm64-v8a.apk \
            android/app/build/outputs/apk/release/app-x86_64-release.apk#qcanva-${VERSION_NAME}-x86_64-emulator.apk
